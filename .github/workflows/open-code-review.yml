name: OpenCodeReview PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The ocr CLI spawns a background self-upgrade (bin/ocr.js) whenever a newer
    # release exists than the pinned ocr_version. npm removes the old binary before
    # installing the new one, so the review step can hit "Cannot find module
    # '/usr/local/bin/ocr'". Pinning stays in ocr_version below.
    # Upstream: alibaba/open-code-review#703, fix in progress in #1204.
    env:
      OCR_NO_UPDATE: '1'
    # Review effort medium; allow time for the slowest review group plus setup and posting.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@fabbdb296b0d97e2140ada8d54ca7d6d6d1d7ad4 # v1.12.13
        with:
          llm_url: https://api.openai.com/v1/responses
          llm_auth_token: ${{ secrets.OPENAI_API_KEY }}
          llm_model: gpt-6-luna
          # Responses API: gpt-6-luna rejects function tools on /v1/chat/completions.
          llm_protocol: openai-responses
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: English
          effort: medium
          # GH_PAT posts as the bot identity when set; otherwise github-actions[bot].
          github_token: ${{ secrets.GH_PAT || github.token }}
          # Pinned to the release verified on the runner. Bump deliberately.
          ocr_version: '1.12.13'
          background: >-
            Website and engineering platform: React, TypeScript and Vite in app/.
            Flag: broken lint or coverage gates, accessibility regressions, and
            motion that ignores prefers-reduced-motion.
          stream_progress: 'true'
          upload_artifacts: 'true'
          sticky_summary: 'true'

