name: Shell Checks

# Guards the pre-commit hooks and other shell scripts: a syntax error in
# hooks/pre-commit-open-code-review disables the local review silently (the
# caller treats a non-zero exit as advisory), so it must be caught in CI.
on:
  # Scope push to the default branch so a feature-branch push does not run the
  # job twice (the same commit also triggers pull_request).  pull_request is
  # deliberately NOT path-filtered: if this check is ever made required in
  # branch protection, a path filter would leave PRs that skip it with a
  # permanently expected-but-missing status.  The job takes ~10s.
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - '.git-hooks/**'
      - '.github/workflows/shell-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Syntax and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The file list lives in ONE place so the trigger paths and the checks
      # cannot drift apart.  A missing hook fails loudly — deleting it would
      # otherwise silently disable the local review, the exact regression
      # this workflow exists to catch.
      - name: Syntax and lint checks
        run: |
          set -euo pipefail
          files=(hooks/pre-commit-open-code-review .git-hooks/pre-commit)
          status=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Expected shell hook not found (deleted or renamed?)"
              status=1
              continue
            fi
            # Pick the interpreter from the shebang (CR stripped for CRLF
            # checkouts) so a POSIX sh script is not validated as bash —
            # they are not mutually compatible.
            case "$(head -n1 "$f" | tr -d '\r')" in
              *bash*) interp=bash ;;
              *)      interp=sh ;;
            esac
            echo "::group::$interp -n $f"
            if "$interp" -n "$f"; then
              echo "OK"
            else
              echo "::error file=$f::Shell syntax error"
              status=1
            fi
            echo "::endgroup::"
          done
          existing=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then existing+=("$f"); fi
          done
          if [ "${#existing[@]}" -gt 0 ]; then
            shellcheck --severity=error --external-sources "${existing[@]}" || status=1
          fi
          exit "$status"
