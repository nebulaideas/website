name: Shell Checks

# Guards the pre-commit hooks and other shell scripts: a syntax error in
# hooks/pre-commit-open-code-review disables the local review silently (the
# caller treats a non-zero exit as advisory), so it must be caught in CI.
on:
  push:
    paths:
      - 'hooks/**'
      - '.git-hooks/**'
      - '.github/workflows/shell-checks.yml'
  pull_request:
    paths:
      - 'hooks/**'
      - '.git-hooks/**'
      - '.github/workflows/shell-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: Syntax and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check
        run: |
          set -euo pipefail
          status=0
          for f in hooks/pre-commit-open-code-review .git-hooks/pre-commit; do
            [ -f "$f" ] || continue
            echo "::group::bash -n $f"
            if bash -n "$f"; then
              echo "OK"
            else
              echo "::error file=$f::Shell syntax error"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: ShellCheck (errors only)
        run: |
          shellcheck --severity=error --external-sources \
            hooks/pre-commit-open-code-review .git-hooks/pre-commit
