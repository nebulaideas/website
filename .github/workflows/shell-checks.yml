name: Shell Checks

# Guards the pre-commit hooks and other shell scripts: a syntax error in
# hooks/pre-commit-open-code-review disables the local review silently (the
# caller treats a non-zero exit as advisory), so it must be caught in CI.
on:
  push:
    paths:
      - 'hooks/**'
      - '.git-hooks/**'
      - '.github/workflows/shell-checks.yml'
  pull_request:
    paths:
      - 'hooks/**'
      - '.git-hooks/**'
      - '.github/workflows/shell-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Collapse the duplicate push + pull_request runs for the same commit.
  group: shell-checks-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Syntax and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check
        run: |
          set -euo pipefail
          files=()
          for f in hooks/pre-commit-open-code-review .git-hooks/pre-commit; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell hooks found — nothing to check."
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            # Pick the interpreter from the shebang so a POSIX sh script is not
            # validated as bash (they are not mutually compatible).
            case "$(head -n1 "$f")" in
              *bash*) interp=bash ;;
              *)      interp=sh ;;
            esac
            echo "::group::$interp -n $f"
            if "$interp" -n "$f"; then
              echo "OK"
            else
              echo "::error file=$f::Shell syntax error"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: ShellCheck (errors only)
        run: |
          set -euo pipefail
          files=()
          for f in hooks/pre-commit-open-code-review .git-hooks/pre-commit; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell hooks found — nothing to lint."
            exit 0
          fi
          shellcheck --severity=error --external-sources "${files[@]}"
